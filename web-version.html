<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="محوّل العملات">
<title>محوّل العملات للدينار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: practical travel tool, calm and quick
   IDEA: a money-changer's receipt slip
   PICTURE: the live result, large, on a deep green banknote band
   COLOUR and TYPE: banknote green, white, a gold accent; Cairo
   LAYOUT: tabs, one calm column, result under input */
:root{color-scheme:light dark;--bg:light-dark(#f2f5f4,#0f1513);--card:light-dark(#fff,#18211e);--ink:light-dark(#14201c,#e9f1ee);--mute:light-dark(#5b6b66,#9fb2ab);--line:light-dark(#dbe4e1,#2a3833);--g:#0e7c66;--g2:#0a5e4e;--gold:#ffd24d}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Cairo,system-ui,sans-serif;overflow-x:clip}
header{background:var(--g);color:#fff;padding:calc(18px + env(safe-area-inset-top)) max(5vw,16px) 14px}
h1{margin:0 0 12px;font-size:26px;line-height:1.1;font-weight:800}
.tabs{display:flex;gap:8px;max-width:560px}
.tabs button{flex:1;min-height:46px;border:0;border-radius:12px;font:600 16px Cairo,sans-serif;background:var(--g2);color:#fff;cursor:pointer}
.tabs button[aria-selected=true]{background:#fff;color:var(--g)}
main{padding:16px max(5vw,16px) calc(24px + env(safe-area-inset-bottom));max-width:592px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;margin-bottom:6px}
input{width:100%;font:800 30px Cairo,sans-serif;text-align:center;direction:ltr;padding:10px;border:2px solid var(--line);border-radius:12px;background:transparent;color:var(--ink)}
input:focus{outline:none;border-color:var(--g)}
.set input{font-size:24px}
.row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;min-height:48px;border:0;border-radius:12px;font:600 18px Cairo,sans-serif;background:light-dark(#e3ece9,#24312d);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--g);color:#fff}
.btn:focus-visible,.tabs button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.res{background:var(--g);color:#fff;border-radius:18px;padding:20px;text-align:center;margin-bottom:14px}
.res small{color:#d8f0ea;font-size:15px}
.big{font-size:clamp(32px,10vw,48px);font-weight:800;line-height:1.15;white-space:nowrap;direction:ltr}
.usd{color:var(--gold);font-size:18px;direction:ltr}
.info{color:var(--mute);text-align:center;font-size:14px;line-height:1.9}
.toast{position:fixed;inset-inline:0;bottom:calc(24px + env(safe-area-inset-bottom));margin:auto;width:max-content;background:#14201c;color:#fff;padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
[hidden]{display:none!important}
.cur{display:flex;gap:10px;align-items:center;margin:4px 0 16px}.cur b{flex:1;color:var(--g);font-size:20px}.cur .btn{flex:none;padding:0 16px}
.dlg{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:9}
.box{background:var(--card);border-radius:18px;padding:16px;width:min(520px,100%);max-height:88vh;display:flex;flex-direction:column}
.box h2{margin:0 0 10px;font-size:20px}
.q{font:400 16px Cairo,sans-serif;text-align:start;direction:rtl;padding:10px 12px}
#list{list-style:none;margin:10px 0;padding:0;overflow:auto;flex:1;min-height:120px}
#list li{padding:12px 8px;border-bottom:1px solid var(--line);cursor:pointer}#list li:hover{background:light-dark(#eef5f2,#22302b)}
#list li small{color:var(--mute)}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header>
  <h1 id="title">محوّل العملات</h1>
  <div class="tabs" role="tablist">
    <button id="tC" role="tab" aria-selected="true">التحويل</button>
    <button id="tS" role="tab" aria-selected="false">أسعار الصرف</button>
  </div>
</header>
<main>
  <section id="sC">
    <div class="card">
      <label for="idr" id="lblIn">السعر بالعملة الأخرى</label>
      <input id="idr" inputmode="numeric" placeholder="0" autocomplete="off">
      <div class="row"><button class="btn" id="z">000+</button><button class="btn" id="clr">مسح</button></div>
    </div>
    <div class="res">
      <small>القيمة بالدينار العراقي</small>
      <div class="big" id="iqd">0 د.ع</div>
      <div class="usd" id="usd">≈ 0 $</div>
    </div>
    <p class="info" id="info"></p>
  </section>
  <section id="sS" hidden>
    <div class="card set">
      <label>العملة الأخرى</label>
      <div class="cur"><b id="curName">لم تُختر بعد</b><button class="btn" id="pick">تغيير العملة</button></div>
      <label for="r1">قيمة 100 دولار بالدينار العراقي</label>
      <input id="r1" inputmode="numeric" placeholder="مثال: 150,000" autocomplete="off">
      <label for="r2" style="margin-top:16px" id="lblR2">قيمة 100 دولار بالعملة الأخرى</label>
      <input id="r2" inputmode="numeric" placeholder="0" autocomplete="off">
      <div class="row"><button class="btn pri" id="save">حفظ</button></div>
    </div>
    <p class="info" id="sInfo"></p>
  </section>
</main>
<div class="dlg" id="dlg" hidden><div class="box">
  <h2>اختر العملة</h2>
  <input id="q" class="q" placeholder="ابحث باسم البلد أو العملة (مثال: بريطانيا)" autocomplete="off">
  <ul id="list"></ul>
  <div id="manual" hidden>
    <input id="mName" class="q" placeholder="اسم العملة (مثال: روبية إندونيسية)">
    <input id="mCode" class="q" placeholder="رمز العملة — اختياري (مثال: IDR)" style="margin-top:8px;direction:ltr">
  </div>
  <div class="row"><button class="btn" id="manBtn">إدخال يدوي</button><button class="btn pri" id="manOk" hidden>تم</button><button class="btn" id="cancel">إلغاء</button></div>
</div></div>
<div class="toast" id="toast"></div>

function labels(){

function calc(){
  const a=iqd100(),b=oth100();
  if(!a||!b){$('iqd').textContent='—';$('usd').textContent='أدخل أسعار الصرف أولاً';return}
  const v=Number(digits($('idr').value))||0;
  $('iqd').textContent=fmt(v*a/b)+' د.ع';

}

    $('info').innerText=`100$ = ${fmt(a)} د.ع  |  100$ = ${fmt(b)} ${n}\n${fmt(u)} ${n} ≈ ${fmt(u*a/b)} د.ع\n1,000 د.ع ≈ ${fmt2(1000*b/a)} ${n}`}

  const c=tab==='c';$('sC').hidden=!c;$('sS').hidden=c;
  $('tC').setAttribute('aria-selected',c);$('tS').setAttribute('aria-selected',!c);
  if(!c){$('r1').value=iqd100()?fmt(iqd100()):'';$('r2').value=oth100()?fmt(oth100()):''}
  labels();info();calc();
}
let shown=entries;
function renderList(){
  const q=norm($('q').value);
  shown=q?entries.filter(e=>q.split(' ').every(w=>e.s.includes(w))):entries;
  $('list').innerHTML=shown.map((e,i)=>`<li data-i="${i}">${esc(e.c)} — <b>${esc(e.cur)}</b> <small>(${esc(e.code)})</small></li>`).join('')||'<li>لا توجد نتائج — جرّب «إدخال يدوي»</li>';
}
function openPicker(){$('dlg').hidden=false;$('manual').hidden=true;$('manOk').hidden=true;$('list').hidden=false;$('q').hidden=false;$('manBtn').hidden=false;$('q').value='';renderList();$('q').focus()}
function closePicker(){$('dlg').hidden=true}
function setCur(name,code){
  cur={name,code};store.set('curName',name);store.set('curCode',code);
  closePicker();$('idr').value='';
  show(oth100()&&iqd100()?'c':'s');if(!oth100())$('r2').focus();
}
$('q').addEventListener('input',renderList);
$('list').onclick=e=>{const li=e.target.closest('li[data-i]');if(li){const x=shown[+li.dataset.i];setCur(x.cur,x.code)}};
$('pick').onclick=openPicker;$('cancel').onclick=closePicker;
$('dlg').onclick=e=>{if(e.target.id==='dlg')closePicker()};
$('manBtn').onclick=()=>{$('list').hidden=true;$('q').hidden=true;$('manual').hidden=false;$('manBtn').hidden=true;$('manOk').hidden=false;$('mName').value='';$('mCode').value='';$('mName').focus()};
$('manOk').onclick=()=>{const n=$('mName').value.trim();if(!n){toast('اكتب اسم العملة');return}setCur(n,$('mCode').value.trim().toUpperCase())};
grouping($('idr'),calc);grouping($('r1'));grouping($('r2'));
$('tC').onclick=()=>show('c');$('tS').onclick=()=>show('s');
$('z').onclick=()=>{const d=digits($('idr').value);if(d&&d.length<=12){$('idr').value=Number(d+'000').toLocaleString('en-US');calc()}};
$('clr').onclick=()=>{$('idr').value='';calc();$('idr').focus()};
$('save').onclick=()=>{
  if(!cur.name){toast('اختر العملة أولاً');openPicker();return}
  const a=Number(digits($('r1').value)),b=Number(digits($('r2').value));
  if(!a||!b){toast('أدخل القيمتين بشكل صحيح');return}
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  store.set('iqd100',a);store.set(key(),b);store.set('savedAt',`${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())}  ${p(d.getHours())}:${p(d.getMinutes())}`);
  document.activeElement.blur();toast('تم الحفظ ✓');show('c');
};
show(cur.name&&iqd100()&&oth100()?'c':'s');
if(!cur.name)openPicker();
}
</script>
</body>
</html>
